<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,intial-scale=1.0">
    <tittle>Contact From</tittle>

    <link rel="stylesheet"href="style.css">
</head>

<body>

    <div class="container">
        <h1>contact Us</h1>

        <form>

            <label for="name">Name</label>
            <input type="text"id="name" placeholder="Enter your name">

            <label for="email">Email</label>
            <input type="email"id="email" placeholder="Enter your email">

            <label for="message">Message</label>
            <textarea id="message" placeholder="Enter your message"></textarea>

            <button type="submit">Submit</button>
            
            <p id="successMessage"></p>

        </form>
    </div>
    
<section class="responsive-section">
    <h2>My Services</h2>

    <div class="services">
        <div class="service-card">
            <h3>Web Design</h3>
            <p>Creating beautiful and user-friendly websites.</p>
        </div>

        <div class="service-card">
            <h3>Web Development</h3>
            <p>Building responsive and interactive websites.</p>
        </div>

        <div class="service-card">
            <h3>JavaScript</h3>
            <p>Adding functionality and interactivity to websites.</p>
        </div>
    </div>
</section>
<section class="todo-section">
    <h2>My To Do List</h2>
    <input type="text" id="taskInput" placeholder="Enter a task">
    <button type="button" id="addTask">AddTask</button>
    <ul id="taskList"></ul>
</section>

<script src="script.js"></script>
</body>
</html>
